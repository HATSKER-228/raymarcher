<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fractal Explorer</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/panel.css">
    <link rel="stylesheet" href="css/tab-main.css">
    <link rel="stylesheet" href="css/tab-settings.css">
    <link rel="stylesheet" href="css/hud.css">
</head>
<body>

    <!-- WebGL canvas -->
    <canvas id="glCanvas"></canvas>

    <!-- fractal selector panel -->
    <div id="ui-panel" class="hidden">
        <div id="tabs-row">
            <div id="main-tab-btn"     data-tab="main"     class="tab-btn active">MAIN</div>
            <div id="settings-tab-btn" data-tab="settings" class="tab-btn">SETTINGS</div> 
        </div>
        <div id="tabs-container">
            <div id="main-tab" data-tab="main" class="tab">
                <div class="tab-title">FRACTAL EXPLORER</div>

                <div id="fractal-list">
                    <div class="fractal-item active" data-fractal="0">
                        <span class="fractal-name">Menger Sponge</span>
                        <span class="fractal-tag">ACTIVE</span>
                    </div>
                    <div class="fractal-item locked" data-fractal="1">
                        <span class="fractal-name">Mandelbulb</span>
                        <span class="fractal-tag">SOON</span>
                    </div>
                    <div class="fractal-item" data-fractal="2">
                        <span class="fractal-name">Mandelbox</span>
                        <span class="fractal-tag"></span>
                    </div>
                    <div class="fractal-item" data-fractal="3">
                        <span class="fractal-name">Sierpinski pyramid</span>
                        <span class="fractal-tag"></span>
                    </div>
                </div>

                <div id="ui-divider"></div>

                <div id="controls-hint">
                    <div class="hint-row"><kbd>W A S D</kbd> Move</div>
                    <div class="hint-row"><kbd>Mouse</kbd> Look</div>
                    <div class="hint-row"><kbd>Space</kbd> Up &nbsp; <kbd>Shift</kbd> Down</div>
                    <div class="hint-row"><kbd>Esc</kbd> Release cursor</div>
                </div>
                
                <div id="ui-divider"></div>

                <div id="loc-copypaste">
                    <div class="loc-row">
                        <input id="loc-input" type="text" placeholder="fractal:x,y,z,yaw,pitch" title="Paste location">
                        <button id="goto-loc-btn">GO</button>
                    </div>
                    <div class="loc-row">
                        <button id="copy-loc-btn" title="Copy current location">COPY LOCATION</button>
                    </div>
                </div>
            </div>

            <div id="settings-tab" data-tab="settings" class="tab hidden">
                <div class="tab-title">SETTINGS</div>
            
                <div id="sliders-group">
                    <div class="slider">
                        <div class="setting-label-row">
                            <label class="setting-label">Mouse sensitivity</label>
                            <span id="mouse-sens-span" class="setting-span">0.001</span>
                        </div>
                        <input type="range" id="mouse-sens-slider" min="0.0001" max="0.005" value="0.001" step="0.0001">
                    </div>
                    <div class="slider">
                        <div class="setting-label-row">
                            <label class="setting-label">Moving speed</label>
                            <span id="move-speed-span" class="setting-span">0.825</span>
                        </div>
                        <input type="range" id="move-speed-slider" min="0.1" max="3.0" value="0.825" step="0.05">
                    </div>
                </div>

                <div id="ui-divider"></div>

                <div id="fps-cap-row">
                    <label class="setting-label">FPS cap</label>
                    <div id="fps-cap-btn-group">
                        <button class="fps-cap-btn" data-fps="30">30</button>
                        <button class="fps-cap-btn" data-fps="60">60</button>
                        <button class="fps-cap-btn" data-fps="90">90</button>
                        <button class="fps-cap-btn active" data-fps="120">120</button>
                        <button class="fps-cap-btn" data-fps="null">∞</button>
                    </div>
                </div>

                <div id="hud-toggle-row">
                    <input type="checkbox" checked id="hud-toggle">
                    <label class="setting-label">Show HUD</label>
                </div>

                
            </div>
        </div>
    </div>
    
    <div id="click-hint" class="hidden">CLICK TO FLY</div>

    <div id="HUD">
        <span id="fps-counter">-- FPS</span>
        <div id="pos-line">XYZ: 0.000, 0.000, 0.000</div>
        <div id="ang-line">YAW: 0.0°  PITCH: 0.0°</div>
    </div>

    <!-- Initial overlay (shown before pointer lock) -->
    <div id="start-overlay">
        <div id="start-box">
            <div id="start-title">FRACTAL EXPLORER</div>
            <div id="start-subtitle">Real-time 3D raymarching</div>
            <button id="start-btn">ENTER</button>
        </div>
    </div>

    <script src="js/shaders/common.js"></script>
    <script src="js/shaders/menger.js"></script>
    <script src="js/shaders/mandelbox.js"></script>
    <script src="js/shaders/sierpinski.js"></script>
    <script src="js/shaders/registry.js"></script>
    <script src="js/camera.js"></script>
    <script src="js/setting.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
